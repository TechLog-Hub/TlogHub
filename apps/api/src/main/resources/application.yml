spring:
  application:
    name: tlog-api
  cache:
    cache-names:
      - public-filter-metadata
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techlog_hub}
    username: ${SPRING_DATASOURCE_USERNAME:techlog}
    password: ${SPRING_DATASOURCE_PASSWORD:techlog}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
