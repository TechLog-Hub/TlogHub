name: tlog-backend

services:
  api:
    image: ${TLOG_API_IMAGE:?TLOG_API_IMAGE is required}
    container_name: ${TLOG_API_CONTAINER_NAME:-tlog-api}
    restart: unless-stopped
    env_file:
      - ${TLOG_API_ENV_FILE:-.env}
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}
    ports:
      - "${TLOG_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
