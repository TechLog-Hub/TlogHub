name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HUSKY: 0

jobs:
  policy-check:
    name: Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root tooling
        run: npm ci

      - name: Validate repository policy
        run: npm run validate:repo:ci

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew :apps:api:unitTest --build-cache --configuration-cache --no-daemon

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      - name: Run integration tests
        run: ./gradlew :apps:api:integrationTest --build-cache --configuration-cache --no-daemon

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root tooling
        run: npm ci

      - name: Dependency review
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Secret pattern scan
        run: npm run security:secrets

  notify-discord:
    name: Notify Discord
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - policy-check
      - unit-test
      - integration-test
      - security-scan
    if: ${{ always() }}
    permissions:
      contents: read
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Skip when webhook is absent
        if: ${{ env.DISCORD_WEBHOOK_URL == '' }}
        run: echo "DISCORD_WEBHOOK_URL is not configured. Skip Discord notification."

      - name: Send CI result
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          POLICY_RESULT: ${{ needs.policy-check.result }}
          UNIT_RESULT: ${{ needs.unit-test.result }}
          INTEGRATION_RESULT: ${{ needs.integration-test.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "${POLICY_RESULT}${UNIT_RESULT}${INTEGRATION_RESULT}${SECURITY_RESULT}" == *"failure"* ]]; then
            STATUS="failed"
            COLOR=15158332
          elif [[ "${POLICY_RESULT}${UNIT_RESULT}${INTEGRATION_RESULT}${SECURITY_RESULT}" == *"cancelled"* ]]; then
            STATUS="cancelled"
            COLOR=9807270
          else
            STATUS="succeeded"
            COLOR=3066993
          fi

          payload=$(jq -n \
            --arg title "Techlog Hub CI ${STATUS}" \
            --arg repo "${REPOSITORY}" \
            --arg ref "${REF_NAME}" \
            --arg url "${RUN_URL}" \
            --arg policy "${POLICY_RESULT}" \
            --arg unit "${UNIT_RESULT}" \
            --arg integration "${INTEGRATION_RESULT}" \
            --arg security "${SECURITY_RESULT}" \
            --argjson color "${COLOR}" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  {name: "Repository", value: $repo, inline: true},
                  {name: "Ref", value: $ref, inline: true},
                  {name: "policy-check", value: $policy, inline: true},
                  {name: "unit-test", value: $unit, inline: true},
                  {name: "integration-test", value: $integration, inline: true},
                  {name: "security-scan", value: $security, inline: true},
                  {name: "Run", value: $url, inline: false}
                ]
              }]
            }')

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d "${payload}" \
            "${DISCORD_WEBHOOK_URL}" || true
