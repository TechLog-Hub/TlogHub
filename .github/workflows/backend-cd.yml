name: Backend CI/CD

on:
  push:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/backend-cd.yml"
      - ".dockerignore"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "apps/api/**"
      - "deploy/backend/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.target || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HUSKY: 0
  REGISTRY: ghcr.io

jobs:
  select-target:
    name: Select Target
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      image_name: ${{ steps.image.outputs.image_name }}
    steps:
      - name: Resolve deployment target
        id: target
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ github.event.inputs.target }}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            ENVIRONMENT="production"
          else
            ENVIRONMENT="staging"
          fi

          if [[ "${ENVIRONMENT}" == "production" ]]; then
            IMAGE_TAG="production"
          else
            IMAGE_TAG="staging"
          fi

          echo "environment=${ENVIRONMENT}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Resolve image name
        id: image
        run: |
          REPOSITORY_LOWER="${GITHUB_REPOSITORY,,}"
          echo "image_name=${REGISTRY}/${REPOSITORY_LOWER}/api" >> "${GITHUB_OUTPUT}"

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      - name: Run backend unit tests
        run: ./gradlew :apps:api:unitTest --build-cache --configuration-cache --no-daemon

      - name: Run backend integration tests
        run: ./gradlew :apps:api:integrationTest --build-cache --configuration-cache --no-daemon

  build-image:
    name: Build And Push API Image
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs:
      - select-target
      - backend-test
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image_ref: ${{ steps.image-ref.outputs.image_ref }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      - name: Build backend boot jar
        run: ./gradlew :apps:api:bootJar --build-cache --configuration-cache --no-daemon

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.select-target.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.select-target.outputs.image_tag }}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tlog-api
          cache-to: type=gha,mode=max,scope=tlog-api

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ needs.select-target.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export immutable image ref
        id: image-ref
        run: |
          echo "image_ref=${{ needs.select-target.outputs.image_name }}@${{ steps.build.outputs.digest }}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs:
      - select-target
      - build-image
    environment:
      name: ${{ needs.select-target.outputs.environment }}
      url: ${{ vars.BACKEND_BASE_URL }}
    permissions:
      contents: read
    env:
      BACKEND_DEPLOY_HOST: ${{ secrets.BACKEND_DEPLOY_HOST }}
      BACKEND_DEPLOY_PORT: ${{ secrets.BACKEND_DEPLOY_PORT }}
      BACKEND_DEPLOY_USER: ${{ secrets.BACKEND_DEPLOY_USER }}
      BACKEND_DEPLOY_SSH_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
      BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
      BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
      BACKEND_REGISTRY_USERNAME: ${{ secrets.BACKEND_REGISTRY_USERNAME }}
      BACKEND_REGISTRY_TOKEN: ${{ secrets.BACKEND_REGISTRY_TOKEN }}
      IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment secrets
        run: |
          missing=()
          for name in BACKEND_DEPLOY_HOST BACKEND_DEPLOY_USER BACKEND_DEPLOY_SSH_KEY BACKEND_DEPLOY_PATH BACKEND_ENV_FILE; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required deployment secrets:\n' >&2
            printf -- '- %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${BACKEND_DEPLOY_SSH_KEY}" > ~/.ssh/backend_deploy_key
          chmod 600 ~/.ssh/backend_deploy_key

          SSH_PORT="${BACKEND_DEPLOY_PORT:-22}"
          ssh-keyscan -p "${SSH_PORT}" "${BACKEND_DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Render deployment env
        run: |
          printf '%s\n' "${BACKEND_ENV_FILE}" > backend.env
          {
            echo ""
            echo "TLOG_API_IMAGE=${IMAGE_REF}"
          } >> backend.env

      - name: Upload Compose bundle
        run: |
          SSH_PORT="${BACKEND_DEPLOY_PORT:-22}"
          SSH_TARGET="${BACKEND_DEPLOY_USER}@${BACKEND_DEPLOY_HOST}"
          ssh -i ~/.ssh/backend_deploy_key -p "${SSH_PORT}" "${SSH_TARGET}" "mkdir -p '${BACKEND_DEPLOY_PATH}'"
          scp -i ~/.ssh/backend_deploy_key -P "${SSH_PORT}" deploy/backend/docker-compose.yml "${SSH_TARGET}:${BACKEND_DEPLOY_PATH}/docker-compose.yml"
          scp -i ~/.ssh/backend_deploy_key -P "${SSH_PORT}" backend.env "${SSH_TARGET}:${BACKEND_DEPLOY_PATH}/.env"

      - name: Run remote deployment
        run: |
          SSH_PORT="${BACKEND_DEPLOY_PORT:-22}"
          SSH_TARGET="${BACKEND_DEPLOY_USER}@${BACKEND_DEPLOY_HOST}"
          REGISTRY_USERNAME="${BACKEND_REGISTRY_USERNAME:-${GITHUB_ACTOR}}"

          if [[ -n "${BACKEND_REGISTRY_TOKEN}" ]]; then
            printf '%s' "${BACKEND_REGISTRY_TOKEN}" \
              | ssh -i ~/.ssh/backend_deploy_key -p "${SSH_PORT}" "${SSH_TARGET}" \
                "docker login ghcr.io -u '${REGISTRY_USERNAME}' --password-stdin"
          fi

          ssh -i ~/.ssh/backend_deploy_key -p "${SSH_PORT}" "${SSH_TARGET}" \
            "cd '${BACKEND_DEPLOY_PATH}' \
              && docker compose --env-file .env -f docker-compose.yml pull api \
              && docker compose --env-file .env -f docker-compose.yml up -d api \
              && docker compose --env-file .env -f docker-compose.yml ps api \
              && docker image prune -f"
